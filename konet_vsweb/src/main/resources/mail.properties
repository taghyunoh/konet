# 거래명세서 이메일 발송 설정 (2026-09-09 신설)
#  · 값이 비어 있으면 서버 발송을 하지 않는다 — 화면이 「메일 계정이 아직 설정되지 않았습니다」로 안내하고
#    [메일 프로그램 열기] / [내용 복사] 로 보내게 한다. 그래서 계정이 없어도 화면은 그대로 돌아간다.
#  · 위너넷(wnn_medcost)과 같은 방식. 네이버는 465 SSL 이고 비밀번호는 로그인 비밀번호가 아니라
#    **애플리케이션 비밀번호**(네이버 메일 ▸ 환경설정 ▸ POP3/IMAP 설정에서 발급)를 넣어야 한다.
#  · ⚠비밀번호가 들어가는 파일이다 — 운영 서버에만 채우고, 소스 저장소에는 빈 채로 둘 것.
#    (톰캣 실행옵션 -Dmail.smtp.password=... 로 주면 이 파일보다 그것이 먼저 쓰인다)

mail.smtp.host=
mail.smtp.port=465
mail.smtp.ssl=true

mail.smtp.user=
mail.smtp.password=
mail.from=
mail.fromName=
