# 거래명세서 이메일 발송 설정 (2026-09-09 신설)
#  · 값이 비어 있으면 서버 발송을 하지 않는다 — 화면이 「메일 계정이 아직 설정되지 않았습니다」로 안내하고
#    [메일 프로그램 열기] / [내용 복사] 로 보내게 한다. 그래서 계정이 없어도 화면은 그대로 돌아간다.
#  · 위너넷(wnn_medcost)과 같은 방식. 네이버는 465 SSL 이고 비밀번호는 로그인 비밀번호가 아니라
#    **애플리케이션 비밀번호**(네이버 메일 ▸ 환경설정 ▸ POP3/IMAP 설정에서 발급)를 넣어야 한다.
#  · ⚠비밀번호가 들어가는 파일이다 — 운영 서버에만 채우고, 소스 저장소에는 빈 채로 둘 것.
#    (톰캣 실행옵션 -Dmail.smtp.password=... 로 주면 이 파일보다 그것이 먼저 쓰인다)

mail.enabled=true
mail.smtp.host=smtp.naver.com
mail.smtp.port=465
mail.smtp.ssl=true

#  ★네이버는 SMTP 아이디 = 보내는 주소의 아이디(@ 앞)여야 한다 — 2026-09-10 실측 : konet → 535 인증 실패 · konet11 → OK
#  ⚠네이버 <보안설정 화면>에 보이는 'konet' 은 «로그인 아이디» 다 — SMTP 인증에 쓰는 것과 다르다.
#    (아이디를 바꾸거나 별명 주소를 쓰면 로그인 아이디와 메일 주소가 갈라진다.)
#    2026-09-10 실측 재확인 : konet11 로 로컬에서 5통 연속 성공(12:48~13:11) · konet 으로 성공한 적 없음.
#    ⇒ 여기 넣을 값은 «mail.from 의 @앞» 이다. from 을 바꾸면 이 줄도 같이 바꿀 것.
mail.smtp.user=konet11
mail.smtp.password=68N5W4KD3VQH
mail.from=konet11@naver.com
mail.fromName=(주)코네트
